<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  </head>
  <body>
    <div id="app">
      <div id="notifications-container" class="notifications-container">
        <!-- Notifications will be inserted here -->
      </div>
      
      <header>
        <h1>Countdown Timer</h1>
        <p class="subtitle">Set a date and time to count down to an important event</p>
      </header>
      
      <main>
        <section class="timer-setup">
          <div class="card">
            <h2>Set Your Countdown</h2>
            <form id="countdown-form">
              <div class="form-group">
                <label for="event-name">Event Name</label>
                <input type="text" id="event-name" placeholder="Enter event name" required>
              </div>
              <div class="form-group">
                <label for="date-time">Date & Time</label>
                <input type="datetime-local" id="date-time" required>
              </div>
              <button type="submit" id="start-button" class="primary-button">Start Countdown</button>
            </form>
          </div>
        </section>

        <section class="timer-display" id="timer-display">
          <!-- Timer display will be inserted here by JavaScript -->
        </section>

        <section class="timers-list" id="timers-list">
          <h2>Your Countdowns</h2>
          <div class="saved-timers" id="saved-timers">
            <!-- Saved timers will be inserted here by JavaScript -->
          </div>
        </section>
      </main>
      
      <footer>
        <p>© 2025 Countdown Timer App</p>
      </footer>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
